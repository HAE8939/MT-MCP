# NAS Docker (Synology Container Manager / QNAP). 
# Keep the published port on the LAN. Do not forward 8787 to the public internet.
# Images are stored in Tencent COS, not on the NAS disk.

services:
  mt-mcp:
    build: .
    image: mt-mcp:local
    container_name: mt-mcp
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
    # Optional Docker secrets instead of putting keys in .env:
    # secrets:
    #   - mcp_auth_token
    #   - cos_secret_id
    #   - cos_secret_key
    # environment:
    #   MCP_AUTH_TOKEN_FILE: /run/secrets/mcp_auth_token
    #   COS_SECRET_ID_FILE: /run/secrets/cos_secret_id
    #   COS_SECRET_KEY_FILE: /run/secrets/cos_secret_key

