  if (img) img.onerror = () => { img.style.visibility = 'hidden'; if (empty) empty.hidden = false; };
}

function compassHTML(dir) {
  const d = Math.round(normDir(dir));
  const items = [
    [315, '↖'], [0, '↑'], [45, '↗'],
    [270, '←'], [null, null], [90, '→'],
    [225, '↙'], [180, '↓'], [135, '↘']
  ];
  return items.map(([v, ch]) => v == null
    ? `<button class="mid" data-dir="0" title="0°（图纸上方）">${d}°</button>`
    : `<button data-dir="${v}" class="${Math.abs(((d - v + 540) % 360) - 180) < 0.5 ? 'cur' : ''}" title="${v}°"><span class="arr">${ch}</span></button>`
  ).join('');
}

function emptyInspectorHTML() {
  const done = PAGES.filter(p => camForPage(p.no)).length;
  const todo = TOTAL - done;
  const cams = state.cams.length;
  const low = PAGES.filter(p => p.conf === 'low').length;
  return `<div class="emptypanel">
    <div class="big">选择左侧任意一张全景</div>
    <p>右侧会出现画面与点位参数；<br>在平面图上按下拖动即可标注。</p>
  </div>
  <div class="mini">
    <div><label>全景</label><b>${TOTAL}</b></div>
    <div><label>已标注</label><b style="color:var(--green)">${done}</b></div>
    <div><label>待标注</label><b>${todo}</b></div>
    <div><label>点位</label><b>${cams}</b></div>
  </div>
  <div class="sect" style="border-top:0;margin-top:14px">
    <h3><span class="bar"></span>各层进度</h3>
    ${FLOORS.map(f => {
      const pages = PAGES.filter(p => sectionFloor(p) === f.id);
      const d = pages.filter(p => camForPage(p.no)).length;
      const pct = pages.length ? Math.round(d / pages.length * 100) : 0;
      return `<div style="margin:9px 0">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-bottom:4px">
          <span>${esc(f.title)}</span><span class="mono" style="color:var(--muted);font:10.5px var(--mono)">${d}/${pages.length} · ${pct}%</span>
        </div>
        <div class="pbar" style="height:4px"><i style="width:${pct}%;background:${f.id === state.floor ? 'var(--accent)' : 'var(--green)'}"></i></div>
      </div>`;
    }).join('')}
    <button class="btn primary" id="emptyNext" style="width:100%;margin-top:10px" ${todo ? '' : 'disabled'}>继续标注下一张未标注</button>
  </div>
  ${low ? `<div class="sect" style="border-top:1px solid var(--line)"><h3><span class="bar"></span>提示</h3>
    <p style="font-size:11px;line-height:1.75;color:var(--muted);margin:0">有 ${low} 张全景的空间归属存疑（列表中带“存疑”标记），标注时可留意。</p></div>` : ''}`;
}

function bindEmptyInspector() {
  const next = $('#emptyNext');
  if (next) next.onclick = () => {
    const p = PAGES.find(x => !camForPage(x.no));
    if (p) openPage(p.no);
  };
}

function bindInspector(p, cam) {
  const expand = $('#btnPrevExpand');
  if (expand) expand.onclick = () => openLightbox(p.no);
  const pv = $('#prevImg');
  if (pv) pv.onclick = () => openLightbox(p.no);
  const prev = $('#btnPrevPage'), next = $('#btnNextPage');
  if (prev) prev.onclick = () => goPage(-1);
  if (next) next.onclick = () => goPage(1);
  const armFloor = $('#armFloor');
  if (armFloor) armFloor.onchange = () => {
    const f = armFloor.value;
    // 这个下拉框改的是“这张全景属于哪一层”，不只是切换平面。
    // 必须记进偏好吗，否则改完一拖会被判定成“本层没有待标的图”而弹回去。
    state.prefs.pageFloor = state.prefs.pageFloor || {};
    state.prefs.pageFloor[p.no] = f;
    if (cam && cam.floor !== f) mutate(() => { cam.floor = f; });
    saveSoon();
    if (f !== state.floor) setFloor(f, { fit: true });
    renderAll();
    toast(`${esc(srcFile(p.no))} 已改到“${floorTitle(f)}”`, 1800);
  };
  if (!cam) return;

  const dirRange = $('#dirRange'), dirNum = $('#dirNum'), fovRange = $('#fovRange');
  const setDir = (val, snap) => {
    let d = normDir(Number(val));
    if (snap) d = normDir(Math.round(d / 15) * 15);
    cam.dir = +d.toFixed(1);
    if (dirRange) dirRange.value = Math.round(d);
    if (dirNum) dirNum.value = Math.round(d);
    const ro = $('#roDir'); if (ro) ro.textContent = Math.round(d);
    const cp = $('#compass'); if (cp) cp.innerHTML = compassHTML(d);
    paintMarker(cam);
    updateRangeFill(dirRange);
    saveSoon();
  };
  if (dirRange) {
    dirRange.style.setProperty('--fill', (cam.dir / 359 * 100) + '%');
    dirRange.onpointerdown = () => { snapshotOnce('dir'); };
    dirRange.oninput = () => setDir(dirRange.value, false);
  }
  if (dirNum) {
    dirNum.onchange = () => { snapshot(); setDir(dirNum.value, false); };
  }
  const compass = $('#compass');
  if (compass) compass.onclick = e => {
    const b = e.target.closest('[data-dir]');
    if (!b) return;
    snapshot();
    setDir(+b.dataset.dir, false);
    renderInspector();
  };
  if (fovRange) {
    fovRange.style.setProperty('--fill', ((cam.fov - 20) / 130 * 100) + '%');
    fovRange.onpointerdown = () => snapshotOnce('fov');
    fovRange.oninput = () => {
      cam.fov = clamp(+fovRange.value, 20, 150);
      const v = $('#fovVal'); if (v) v.textContent = Math.round(cam.fov) + '°';
      fovRange.style.setProperty('--fill', ((cam.fov - 20) / 130 * 100) + '%');
      document.querySelectorAll('#fovPresets button').forEach(b => b.classList.toggle('on', +b.dataset.fov === Math.round(cam.fov)));
      paintMarker(cam);
      saveSoon();
    };
  }
  const fovPresets = $('#fovPresets');
  if (fovPresets) fovPresets.onclick = e => {
    const b = e.target.closest('[data-fov]');
    if (!b) return;
    snapshot();
    cam.fov = +b.dataset.fov;
    saveSoon();
    renderInspector();
    paintMarker(cam);
  };
  const name = $('#camName');
  if (name) {
    name.onfocus = () => snapshotOnce('name');
    name.oninput = () => { cam.name = name.value; saveSoon(); };
  }
  const floorSel = $('#camFloor');
  if (floorSel) floorSel.onchange = () => {
    snapshot();
    cam.floor = floorSel.value;
    const f = FLOOR_BY_ID.get(cam.floor);
    cam.x = clamp(cam.x, 0, f.w);
    cam.y = clamp(cam.y, 0, f.h);
    saveSoon();
    if (cam.floor !== state.floor) setFloor(cam.floor);
    renderAll();
  };
  const links = $('#pageLinks');
  if (links) links.onclick = e => {
    const un = e.target.closest('[data-unlink]');
    if (un) {
      const n = +un.dataset.unlink;
      snapshot();
      cam.pages = cam.pages.filter(x => x !== n);
      if (n === state.page) state.armed = true;
      saveSoon();
      renderAll();
      return;
    }
    if (e.target.closest('#btnLink')) openLinkPicker(cam);
  };
  const focus = $('#btnFocus'); if (focus) focus.onclick = () => focusCam(cam);
  const lock = $('#btnLock'); if (lock) lock.onclick = () => {
    snapshot(); cam.locked = !cam.locked; saveSoon(); renderAll();
    toast(cam.locked ? '已锁定，拖动不会移动点位' : '已解锁', 1500);
  };
  const del = $('#btnDelete'); if (del) del.onclick = () => deleteCam(cam);
}

function updateRangeFill(el) {
  if (!el) return;
  const min = +el.min || 0, max = +el.max || 100;
  el.style.setProperty('--fill', ((+el.value - min) / (max - min) * 100) + '%');
}

/* 连续拖动滑块时只记录一次撤销点 */
let onceKey = null;
function snapshotOnce(key) {
  if (onceKey === key) return;
  onceKey = key;
  snapshot();
}
document.addEventListener('pointerup', () => { onceKey = null; });

function goPage(delta) {
  if (state.page == null) return;
  const i = PAGE_INDEX.get(state.page);
  const p = PAGES[clamp(i + delta, 0, PAGES.length - 1)];
  if (p) openPage(p.no);
}

/* =========================================================
   13. 放置 / 拖动 / 旋转
   ========================================================= */
function beginPan(e) {
  state.drag = { type: 'pan', sx: e.clientX, sy: e.clientY, tx: state.view.tx, ty: state.view.ty };
  stage.classList.add('panning');
  try { stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
}
function beginMove(e, cam) {
  if (cam.locked) {
    state.page = cam.pages[0];
    state.armed = false;
    renderAll();
    syncListSel(true);
    toast('点位已锁定，解锁后才能移动', 1600);
    return;
  }
  state.page = cam.pages[0];
  state.armed = false;
  state.drag = {
    type: 'move', cam, sx: e.clientX, sy: e.clientY,
    ox: cam.x, oy: cam.y, start: toImage(e.clientX, e.clientY)
  };
  snapshot();
  syncListSel(true);
  renderInspector();
  state.armed = false;
  try { stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
}
function beginRotate(e, cam) {
  // 实景全景不需要朝向：点到圆点时改为移动
  beginMove(e, cam);
}
function beginPlace(e) {
  const target = pickTarget();
  if (target == null) {
    toast('所有全景都已标注完成', 2000);
    return;
  }
  const targetFloor = sectionFloor(PAGE_BY_NO.get(target));
  if (targetFloor !== state.floor) setFloor(targetFloor, { fit: true });
  const pt = toImage(e.clientX, e.clientY);
  if (pt.x < 0 || pt.y < 0 || pt.x > state.planW || pt.y > state.planH) return;
  e.preventDefault();
  stage.classList.add('placing');
  state.page = target;
  state.armed = true;
  // point-only: record click position; direction unused
  state.drag = { type: 'place', pageNo: target, x: pt.x, y: pt.y, moved: false };
  try { stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  hideTip();
  renderList();
  syncListSel(true);
  renderInspector();
  renderHint();
  renderDraft();
}

function onPointerDown(e) {
  if (e.target.closest('.hud, .onboard, .planfail, #tip')) return;
  if (e.button === 2) { beginPan(e); return; }
  if (e.button === 1 || state.space) { e.preventDefault(); beginPan(e); return; }
  if (e.button !== 0) return;
  const camEl = e.target.closest('[data-cam]');
  if (camEl) {
    const cam = state.cams.find(c => c.id === camEl.dataset.cam);
    if (!cam) return;
    beginMove(e, cam);
    return;
  }
  beginPlace(e);
}

function onPointerMove(e) {
  const pt = toImage(e.clientX, e.clientY);
  updateCoord(pt);

  if (!state.drag) {
    const camEl = e.target.closest && e.target.closest('[data-cam]');
    if (camEl) showTip(camEl.dataset.cam, e);
    else hideTip();
    return;
  }
  const d = state.drag;
  if (d.type === 'pan') {
    state.view.tx = d.tx + (e.clientX - d.sx);
    state.view.ty = d.ty + (e.clientY - d.sy);
    state.viewTouched = true;
    applyView();
    state.views[state.floor] = { ...state.view };
    return;
  }
  if (d.type === 'place') {
    // drag to fine-tune point before release
    if (pt.x >= 0 && pt.y >= 0 && pt.x <= state.planW && pt.y <= state.planH) {
      if (Math.hypot(pt.x - d.x, pt.y - d.y) > 2) d.moved = true;
      d.x = pt.x; d.y = pt.y;
    }
    renderDraft();
    return;
  }
  if (d.type === 'move') {
    const dx = pt.x - d.start.x, dy = pt.y - d.start.y;
    let nx = d.ox + dx, ny = d.oy + dy;
    if (e.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) ny = d.oy; else nx = d.ox; }
    d.cam.x = +clamp(nx, 0, state.planW).toFixed(1);
    d.cam.y = +clamp(ny, 0, state.planH).toFixed(1);
    paintMarker(d.cam);
    updateCamReadout(d.cam);
    return;
  }
  // rotate disabled for panorama points
}

function updateCamReadout(cam) {
  const x = $('#roX'), y = $('#roY');
  if (x) x.textContent = Math.round(cam.x);
  if (y) y.textContent = Math.round(cam.y);
}

function onPointerUp(e) {
  const d = state.drag;
  if (!d) return;
  state.drag = null;
  stage.classList.remove('panning');
  stage.classList.remove('placing');
  try { stage.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }

  if (d.type === 'place') {
    draftLayer.innerHTML = '';
    commitPlace(d);
    return;
  }
  if (d.type === 'move' || d.type === 'rotate') {
    saveNow();
    renderInspector();
    renderMarkers();
    renderList();
    return;
  }
  if (d.type === 'pan') {
    saveNow();
  }
}

function onWheel(e) {
  e.preventDefault();
  const factor = Math.exp(-clamp(e.deltaY, -120, 120) * 0.0018);
  zoomAt(e.clientX, e.clientY, factor);
}

function updateCoord(pt) {
  if (!coordEl) return;
  const x = Math.round(pt.x), y = Math.round(pt.y);
  const nx = state.planW ? Math.round(pt.x / state.planW * 100) : 0;
  const ny = state.planH ? Math.round(pt.y / state.planH * 100) : 0;
  coordEl.innerHTML = `<span>x <b>${x}</b></span><span>y <b>${y}</b></span><span><b>${nx}%</b> · <b>${ny}%</b></span>`;
}

function showTip(id, e) {
  const cam = state.cams.find(c => c.id === id);
  if (!cam) { hideTip(); return; }
  const p = PAGE_BY_NO.get(cam.pages[0]);
  const r = stageRect();
  tipEl.innerHTML = `<b>${esc(srcLabel(cam.pages[0]))}</b> ${esc(p ? p.room : '')}${cam.pages.length > 1 ? ` +${cam.pages.length - 1}` : ''}
    <span>${esc(p ? p.view : '')}</span>
    <span>点位 (${Math.round(cam.x)}, ${Math.round(cam.y)})${cam.locked ? ' · 已锁定' : ''}</span>`;
  tipEl.style.left = (e.clientX - r.left) + 'px';
  tipEl.style.top = (e.clientY - r.top - 14) + 'px';
  tipEl.classList.add('show');
}
function hideTip() { tipEl.classList.remove('show'); }

/* =========================================================
   14. 快捷键 / 全局事件
   ========================================================= */
function isTyping() {
  const el = document.activeElement;
  return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
}

function onKeyDown(e) {
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if (ctrl && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (ctrl && e.key.toLowerCase() === 'p') { e.preventDefault(); printPlan(false); return; }

  if (e.key === 'Escape') {
    if ($('#lightbox').classList.contains('show')) { closeLightbox(); return; }
    if ($('#modal').classList.contains('show')) { closeModal(); return; }
    if (state.drag) { cancelDrag(); return; }
    if (isTyping()) { document.activeElement.blur(); return; }
    closePage();
    return;
  }

  if ($('#modal').classList.contains('show') || $('#lightbox').classList.contains('show')) return;
  if (isTyping()) return;

  if (e.key === '/' ) { e.preventDefault(); searchEl.focus(); searchEl.select(); return; }
  if (e.key === '?') { e.preventDefault(); openHelp(); return; }
  switch (e.key.toLowerCase()) {
    case 'f': e.preventDefault(); fitView(); break;
    case 'l': e.preventDefault(); toggleLabels(); break;
    case 'w': e.preventDefault(); toggleWedges(); break;
    case 'n': {
      e.preventDefault();
      const p = PAGES.find(x => !camForPage(x.no));
      if (p) openPage(p.no); else toast('全部已标注完成');
      break;
    }
    case 'q': case 'e': { /* panorama: no heading nudge */ break; }
    case '1': case '2': case '3': case '4': {
      const f = FLOORS[+e.key - 1];
      if (f) { setFloor(f.id); scrollToFloor(f.id); }
      break;
    }
    case 'delete': case 'backspace': {
      if (selectedCam()) { e.preventDefault(); deleteSelected(); }
      break;
    }
    case 'arrowleft': case 'arrowright': case 'arrowup': case 'arrowdown': {
      const cam = selectedCam();
      if (!cam) break;
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1;
      if (e.key === 'ArrowLeft') cam.x = clamp(cam.x - step, 0, state.planW);
      if (e.key === 'ArrowRight') cam.x = clamp(cam.x + step, 0, state.planW);
      if (e.key === 'ArrowUp') cam.y = clamp(cam.y - step, 0, state.planH);
      if (e.key === 'ArrowDown') cam.y = clamp(cam.y + step, 0, state.planH);
      if (!e.repeat) snapshot();
      saveSoon();
      paintMarker(cam);
      updateCamReadout(cam);
      break;
    }
    case 'pageup': goPage(-1); break;
    case 'pagedown': goPage(1); break;
    case ',': goPage(-1); break;
    case '.': goPage(1); break;
    case '+': case '=': zoomCenter(1.2); break;
    case '-': zoomCenter(1 / 1.2); break;
  }
}

function onKeyUp(e) {
  if (e.code === 'Space') { state.space = false; stage.classList.remove('space'); }
}

function cancelDrag() {
  const d = state.drag;
  if (!d) return;
  if (d.type === 'place') {
    draftLayer.innerHTML = '';
    state.armed = true;
  }
  state.drag = null;
  stage.classList.remove('panning');
  stage.classList.remove('placing');
  renderHint();
}

function toggleLabels() {
  state.prefs.labels = !state.prefs.labels;
  $('#btnLabels').classList.toggle('on', state.prefs.labels);
  renderMarkers();
  saveSoon();
}
function toggleWedges() {
  state.prefs.wedges = !state.prefs.wedges;
  $('#btnWedges').classList.toggle('on', state.prefs.wedges);
  renderMarkers();
  saveSoon();
}

function scrollToFloor(id) {
  const p = PAGES.find(x => sectionFloor(x) === id);
  if (!p) return;
  const row = listEl.querySelector(`.row[data-page="${p.no}"]`);
  if (!row) return;
  let head = row.previousElementSibling;
  while (head && !head.classList.contains('ghead')) head = head.previousElementSibling;
  (head || row).scrollIntoView({ block: 'start' });
}

/* =========================================================
   15. 弹窗 / 帮助 / 关联
   ========================================================= */
let modalCancel = null;
function openModal(html, opts = {}) {
  const box = $('#modalBox');
  box.className = 'box' + (opts.narrow ? ' narrow' : '');
  box.innerHTML = html;
  $('#modal').classList.add('show');
  $('#modal').setAttribute('aria-hidden', 'false');
  const x = box.querySelector('.x');
  if (x) x.onclick = closeModal;
  if (opts.onMount) opts.onMount(box);
}
function closeModal() {
  const cancel = modalCancel;
  modalCancel = null;
  $('#modal').classList.remove('show');
  $('#modal').setAttribute('aria-hidden', 'true');
  $('#modalBox').innerHTML = '';
  if (cancel) { try { cancel(); } catch (e) { /* ignore */ } }
}

function confirmDialog({ title, body, ok = '确定', cancel = '取消', danger = false }) {
  return new Promise(resolve => {
    let settled = false;
    const finish = v => {
      if (settled) return;
      settled = true;
      modalCancel = null;
      closeModal();
      resolve(v);
    };
    openModal(`<div class="mhead"><h3>${esc(title)}</h3><button class="x" aria-label="关闭"><svg class="i"><use href="#ico-close"/></svg></button></div>
      <div class="mbody">${body}</div>
      <div class="mfoot"><button class="btn" data-act="cancel">${esc(cancel)}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-act="ok">${esc(ok)}</button></div>`,
      {
        narrow: true,
        onMount(box) {
          box.querySelector('[data-act="cancel"]').onclick = () => finish(false);
          box.querySelector('[data-act="ok"]').onclick = () => finish(true);
        }
      });
    modalCancel = () => finish(false);
  });
}

function assetRoots() {
  const dirs = [];
  const seen = new Set();
  const add = (file) => {
    const parts = String(file || '').split('/');
    const part = parts.length > 1 ? parts[0] : '';
    if (!part || seen.has(part)) return;
    seen.add(part);
    dirs.push(part);
  };
  FLOORS.forEach(f => add(f.plan));
  PAGES.forEach(p => add(p.file));
  return dirs;
}

function openHelp() {
  openModal(`<div class="mhead"><h3>使用说明</h3><button class="x" aria-label="关闭"><svg class="i"><use href="#ico-close"/></svg></button></div>
  <div class="mbody">
    <h4>三步标注</h4>
    <ol style="padding-left:18px;margin:0 0 12px">
      <li>在左侧清单里选一张全景（右侧立即显示画面）。</li>
      <li>在平面图上<b>单击</b>：在平面落下全景点位；按住拖动可微调落点。实景全景不需要朝向。</li>
      <li>松开即完成，并自动跳到下一张未标注的全景。一层标完会自动切到下一层。</li>
    </ol>
    <h4>可以做的调整</h4>
    <ul>
      <li>拖动圆点移动全景点位；按住 Shift 可锁定水平/垂直。</li>
      <li>右侧可查看点位坐标；实景全景不使用方位角与视场角。</li>
      <li>同一位置的重复图（如 p026 与 p023）可“+ 关联”到一个点位，只标一次。</li>
      <li>点位可锁定，避免误拖动；删除后可用 Ctrl+Z 撤销。</li>
      <li>标记右上角的小点：琥珀色＝该图空间归属存疑，深绿色＝点位已锁定。</li>

const lb = { scale: 1, tx: 0, ty: 0, drag: null, page: null };
function openLightbox(no) {
  const p = PAGE_BY_NO.get(no);
  if (!p) return;
  lb.page = no; lb.scale = 1; lb.tx = 0; lb.ty = 0;
  const img = $('#lbImg');
  img.style.transform = 'translate(0,0) scale(1)';
  img.src = pageSrc(p);
  img.alt = `${srcFile(p.no)} ${p.room}`;
  $('#lbTitle').innerHTML = `${esc(srcFile(p.no))} · ${esc(p.room)} <span class="dim" style="font-weight:400;margin-left:6px">${esc(p.view)}</span>`;
  $('#lightbox').classList.add('show');
  $('#lightbox').setAttribute('aria-hidden', 'false');
}
function closeLightbox() {
  $('#lightbox').classList.remove('show');
  $('#lightbox').setAttribute('aria-hidden', 'true');
  $('#lbImg').removeAttribute('src');
}
function lbReset() {
  lb.scale = 1; lb.tx = 0; lb.ty = 0;
  $('#lbImg').style.transform = 'translate(0,0) scale(1)';
}
function lbZoom(factor, cx, cy) {
  const img = $('#lbImg');
  const r = img.getBoundingClientRect();
  const ns = clamp(lb.scale * factor, 1, 8);
  if (ns === lb.scale) return;
  const ox = cx - (r.left + r.width / 2);
  const oy = cy - (r.top + r.height / 2);
  lb.tx = ox - (ox - lb.tx) * (ns / lb.scale);
  lb.ty = oy - (oy - lb.ty) * (ns / lb.scale);
  lb.scale = ns;
  img.style.transform = `translate(${lb.tx}px,${lb.ty}px) scale(${lb.scale})`;
}

function exportJSON() {
  const data = {
    schema: SCHEMA_ID,
    project: BOOT.project,
    sourcePdf: BOOT.sourcePdf,
    exportedAt: new Date().toISOString(),
    note: '实景全景点位：仅记录平面图像素坐标 x/y 与归一化 nx/ny；dir/fov 不使用（为 null）。',
    floors: FLOORS.map(f => ({
      id: f.id, title: f.title, name: f.name, plan: BASE + f.plan, w: f.w, h: f.h,
      cameras: camsOnFloor(f.id).slice().sort((a, b) => a.pages[0] - b.pages[0]).map(c => ({
        id: c.id,
        pages: c.pages.slice().sort((a, b) => a - b),
        primary: c.pages[0],
        x: +c.x.toFixed(1), y: +c.y.toFixed(1),
        nx: +(c.x / f.w).toFixed(5), ny: +(c.y / f.h).toFixed(5),
        dir: null,
        fov: null,
        name: c.name || '',
        note: c.note || '',
        locked: !!c.locked
      }))
    })),
    pages: PAGES.map(p => {
      const c = camForPage(p.no);
      return {
        no: p.no, floor: sectionFloor(p), room: p.room, view: p.view,
        conf: p.conf, note: p.note, file: BASE + p.file,
        camera: c ? c.id : null
      };
    })
  };
  download(EXPORT_BASE + '-机位标注.json', JSON.stringify(data, null, 2), 'application/json;charset=utf-8');
  toast('JSON 已导出');
}

function markedRows() {
  const rows = [];
  for (const p of PAGES) {
    const c = camForPage(p.no);
    if (!c) continue;
    const f = FLOOR_BY_ID.get(c.floor);
    rows.push({
      no: p.no, room: p.room, view: p.view, conf: p.conf, note: p.note,
      floor: floorTitle(c.floor), floorId: c.floor,
      x: Math.round(c.x), y: Math.round(c.y),
      nx: (c.x / f.w).toFixed(3), ny: (c.y / f.h).toFixed(3),
      dir: null, fov: null,
      name: c.name, pages: c.pages
    });
  }
  return rows.sort((a, b) => a.no - b.no);
}

function exportMarkdown() {
  const rows = markedRows();
  const unmarked = PAGES.filter(p => !camForPage(p.no)).length;
  const now = new Date().toLocaleString('zh-CN');
  let md = `# ${EXPORT_BASE} · 实景全景点位\n\n`;
  md += `导出时间：${now}\n\n`;
  md += `共 ${TOTAL} 张全景，已标注 ${rows.length} 张，未标注 ${unmarked} 张。\n\n`;
  md += `实景全景点位仅记录落点；nx/ny 为平面图归一化坐标（0-1）。dir/fov 不使用。\n\n`;
  for (const f of FLOORS) {
    const fr = rows.filter(r => r.floorId === f.id);
    md += `## ${f.title} · ${fr.length} 个点位\n\n`;
    md += `图纸：\`${BASE}${f.plan}\`（${f.w} × ${f.h} px）\n\n`;
    if (!fr.length) { md += `> 本层尚未标注。\n\n`; continue; }
    md += `| 文件 | 空间 | 画面主体 | 点位像素 | 归一化 | 点位名 | 备注 |\n|---|---|---|---|---|---|---|\n`;
    for (const r of fr) {
      md += `| ${srcFile(r.no)} | ${r.room} | ${r.view.replace(/\|/g, '\\|')} | ${r.x}, ${r.y} | ${r.nx}, ${r.ny} | ${r.name || ''} | ${(r.note || '').replace(/\|/g, '\\|')} |\n`;
    }
    md += `\n`;
  }
  const todo = PAGES.filter(p => !camForPage(p.no));
  if (todo.length) {
    md += `## 未标注清单（${todo.length} 张）\n\n`;
    md += todo.map(p => `- ${srcFile(p.no)} · ${p.room} · ${p.view}`).join('\n') + '\n';
  }
  download(EXPORT_BASE + '-机位标注.md', md, 'text/markdown;charset=utf-8');
  toast('Markdown 已导出');
}

function exportCSV() {
  const rows = markedRows();
  const head = ['文件', '页码', '楼层', '空间', '画面主体', '置信', 'X', 'Y', '归一化X', '归一化Y', '点位名', '关联页', '备注'];
  const escCSV = v => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const body = rows.map(r => [
    srcFile(r.no), 'p' + pad3(r.no), r.floor, r.room, r.view, r.conf, r.x, r.y, r.nx, r.ny, r.name, r.pages.map(n => 'p' + pad3(n)).join(' '), r.note
  ].map(escCSV).join(','));
  const csv = '\ufeff' + [head.join(','), ...body].join('\r\n');
  download(EXPORT_BASE + '-机位标注.csv', csv, 'text/csv;charset=utf-8');
  toast('CSV 已导出');

function exportSummary() {
  const rows = markedRows();
  if (!rows.length) { toast('还没有标注任何点位'); return; }
  const text = rows.map(r => `${srcLabel(r.no)}｜${r.room}｜${r.floor}｜${r.x},${r.y}（${r.nx},${r.ny}）｜${r.dir}°／${r.fov}°${r.name ? '｜' + r.name : ''}`).join('\n');
  copyText(text).then(ok => toast(ok ? `已复制 ${rows.length} 条点位摘要` : '复制失败，请改用导出'));
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

async function exportPNG() {
  const f = FLOOR_BY_ID.get(state.floor);
  const entry = state.planCache[state.floor];
  if (!entry || !entry.ok || !entry.img || !entry.img.complete) { toast('图纸还没加载完，稍后再试'); return; }
  const cams = camsOnFloor(f.id).slice().sort((a, b) => a.pages[0] - b.pages[0]);
  if (!cams.length) { toast('当前楼层还没有点位'); return; }
  const W = f.w, H = f.h;
  const pad = Math.round(W * 0.03), head = Math.round(W * 0.085), foot = Math.round(W * 0.05);
  const cw = W + pad * 2, ch = H + head + foot;
  const cv = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#f6f3ea';
  ctx.fillRect(0, 0, cw, ch);
  try {
    ctx.drawImage(entry.img, pad, head, W, H);
    ctx.strokeStyle = 'rgba(120,105,80,.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(pad + .5, head + .5, W - 1, H - 1);

    const r = Math.max(8, Math.round(W / 170));
    for (const c of cams) {
      const x = pad + c.x, y = head + c.y;
      // panorama point only — no heading cone

      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = '#2b3034';
      ctx.fill();
      ctx.lineWidth = Math.max(1.5, r * .2);
      ctx.strokeStyle = '#f6f3ea';
      ctx.stroke();

      ctx.fillStyle = '#fffdf8';
      ctx.font = `600 ${Math.round(r * .95)}px "Microsoft YaHei",sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(c.pages[0]), x, y + r * .04);

      const p = PAGE_BY_NO.get(c.pages[0]);
      if (p && (state.prefs.labels || cams.length <= 24)) {
        ctx.font = `600 ${Math.round(r * .82)}px "Microsoft YaHei",sans-serif`;
        ctx.textAlign = 'left';
        ctx.lineWidth = Math.max(2, r * .32);
        ctx.strokeStyle = '#f6f3ea';
        ctx.lineJoin = 'round';
        ctx.strokeText(p.room, x + r + 3, y - r * .1);
        ctx.fillStyle = '#22262a';
        ctx.fillText(p.room, x + r + 3, y - r * .1);
      }
    }

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#22262a';
    ctx.font = `600 ${Math.round(W * .024)}px "Microsoft YaHei",sans-serif`;
    ctx.fillText(`${BOOT.project} · ${f.title} 机位标注`, pad, pad * 1.35);
    ctx.fillStyle = '#8a8b82';
    ctx.font = `${Math.round(W * .011)}px "Microsoft YaHei",sans-serif`;
    ctx.fillText(`${cams.length} 个点位 · ${pTodate()} · 圆点为全景点位（实景全景，无朝向/视场）`, pad, pad * 1.35 + W * .03);
    ctx.fillStyle = '#8a8b82';
    ctx.font = `${Math.round(W * .0095)}px "Microsoft YaHei",sans-serif`;
    ctx.fillText(`图纸：${f.plan}（${W} × ${H} px）`, pad, ch - pad * .55);

    const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
    if (!blob) throw new Error('empty');
    download(`${EXPORT_BASE}-${f.title.replace(/\s+/g, '')}-点位图.png`, blob);
    toast('标注图纸已导出');
  } catch (err) {
    toast('本地文件模式禁止直接存图：已打开打印视图，请选择“另存为 PDF”', 4600);
    setTimeout(printPlan, 350);
  }
}

/* -------------------------------------------------------------------------
   打印版：整张标注图（标题 + 平面 + 点位 + 图例）做在**一个** SVG 里。
   这样平面位图和点位永远在同一坐标系里一起缩放，不会被浏览器按页拆开。
   viewBox 固定 4000×2700（1.481），A4/A3 横向都能整页放下。
   ------------------------------------------------------------------------- */
const PS = { w: 4000, h: 2700, pad: 64, head: 190, foot: 180, pin: 30, label: 32, cone: 112, ray: 138 };

function printMarkerSVG(cam, x, y, showLabel) {
  const p = PAGE_BY_NO.get(cam.pages[0]);
  const room = p ? p.room : '';
  const label = showLabel && room
    ? `<text x="16" y="4" font-size="13" fill="#2b3034" font-family="system-ui,sans-serif">${esc(room)}</text>` : '';
  return `<g transform="translate(${f2(x)} ${f2(y)})">
    <circle r="12" fill="rgba(255,253,248,.95)" stroke="rgba(176,84,60,.55)" stroke-width="1.2"/>
    <circle r="8.5" fill="#b0543c"/>
    <text y="3.5" text-anchor="middle" font-size="9" fill="#fffdf8" font-family="ui-monospace,monospace">${srcNum(cam.pages[0])}</text>
    ${label}
  </g>`;
}

function buildPrintSheet(floorId = state.floor, append = false) {
  const f = FLOOR_BY_ID.get(floorId) || FLOOR_BY_ID.get(state.floor);
  const cams = camsOnFloor(f.id).slice().sort((a, b) => a.pages[0] - b.pages[0]);
  const W = f.w, H = f.h;
  const box = { x: PS.pad, y: PS.head, w: PS.w - PS.pad * 2, h: PS.h - PS.head - PS.foot };
  const s = Math.min(box.w / W, box.h / H);
  const pw = W * s, ph = H * s;
  const px = box.x + (box.w - pw) / 2;
  const py = box.y + (box.h - ph) / 2;

  // 标签避让（在版面坐标系里算，密集点位不会糊成一片）
  const labelBoxes = [];
  const showLabel = new Set();
  for (const c of cams) {
    const p = PAGE_BY_NO.get(c.pages[0]);
    if (!p || !p.room) continue;
    const cx = px + c.x * s, cy = py + c.y * s;
    const b = { x1: cx + PS.pin + 14, y1: cy - 19, x2: cx + PS.pin + 14 + textWidth(p.room, PS.label), y2: cy + 19 };
    if (labelBoxes.some(x => boxHit(x, b))) continue;
    labelBoxes.push(b);
    showLabel.add(c.id);
  }

  if (!append) {
    document.querySelectorAll('.print-sheet').forEach(s => s.remove());
  }
  const sheet = document.createElement('div');
  sheet.className = 'print-sheet' + (append ? ' ps-next' : '');
  if (!append) sheet.id = 'printSheet';
  sheet.innerHTML = `<svg class="ps-svg" viewBox="0 0 ${PS.w} ${PS.h}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${PS.w}" height="${PS.h}" fill="#ffffff"/>
    <text x="${PS.pad}" y="114" font-size="62" font-weight="600" fill="#22262a">${esc(BOOT.project)} · ${esc(f.title)} 机位标注</text>
    <text x="${PS.w - PS.pad}" y="110" text-anchor="end" font-size="34" fill="#77786f">${cams.length} 个点位 · ${pTodate()} · 图纸 ${W} × ${H} px</text>
    <line x1="${PS.pad}" y1="158" x2="${PS.w - PS.pad}" y2="158" stroke="#22262a" stroke-width="2"/>
    <g transform="translate(${f2(px)} ${f2(py)}) scale(${s.toFixed(5)})">
      <image href="${esc(planSrc(f))}" width="${W}" height="${H}" preserveAspectRatio="none"/>
    </g>
    <rect x="${f2(px)}" y="${f2(py)}" width="${f2(pw)}" height="${f2(ph)}" fill="none" stroke="#b7b1a3" stroke-width="1.5"/>
    ${cams.map(c => printMarkerSVG(c, px + c.x * s, py + c.y * s, showLabel.has(c.id))).join('')}
    <line x1="${PS.pad}" y1="${PS.h - PS.foot + 26}" x2="${PS.w - PS.pad}" y2="${PS.h - PS.foot + 26}" stroke="#ddd7c9" stroke-width="1.5"/>
    <text x="${PS.pad}" y="${PS.h - 46}" font-size="30" fill="#6f7068">圆点为全景点位；实景全景仅标落点，无朝向与视场角。</text>
    <text x="${PS.w - PS.pad}" y="${PS.h - 46}" text-anchor="end" font-size="27" fill="#93948b">${esc(BASE + f.plan)}</text>
  </svg>`;
  document.body.appendChild(sheet);
  document.body.classList.add('printing');
  return sheet;
}

function printPlan(allFloors = false) {
  if (allFloors) {
    if (!FLOORS.some(f => camsOnFloor(f.id).length)) { toast('还没有标注任何点位', 1800); return; }
  } else if (!camsOnFloor(state.floor).length) {
    toast(`“${floorTitle(state.floor)}”还没有点位，换个楼层再打印`, 2400);
    return;
  }
  const targets = allFloors
    ? FLOORS.filter(f => camsOnFloor(f.id).length)
    : [FLOOR_BY_ID.get(state.floor)];
  const list = targets.length ? targets : [FLOOR_BY_ID.get(state.floor)];
  list.forEach((f, i) => buildPrintSheet(f.id, i > 0));

  const srcs = list.map(f => planSrc(f));
  let pending = srcs.length;
  let fired = false;
  const go = () => {
    if (fired) return;
    fired = true;
    setTimeout(() => { try { window.print(); } catch (e) { /* 忽略 */ } }, 320);
  };
  srcs.forEach(src => {
    let counted = false;
    const done = () => {
      if (counted) return;
      counted = true;
      if (--pending <= 0) go();
    };
    const pre = new Image();
    pre.onload = done;
    pre.onerror = done;
    pre.src = src;
    if (pre.complete && pre.naturalWidth) done();
  });
  setTimeout(go, 3000);

  setTimeout(() => {
    document.querySelectorAll('.print-sheet').forEach(s => s.remove());
    document.body.classList.remove('printing');
  }, 60000);
}

function pTodate() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

async function importJSON(file) {
  let raw;
  try { raw = await file.text(); } catch (e) { toast('文件读取失败'); return; }
  let obj;
  try { obj = JSON.parse(raw); } catch (e) { toast('不是有效的 JSON 文件'); return; }
  const cams = normalizeImport(obj);
  if (!cams.length) { toast('文件里没有可识别的点位数据'); return; }
  if (state.cams.length) {
    const ok = await confirmDialog({
      title: '导入点位',
      body: `<p>当前已有 <b>${state.cams.length}</b> 个点位，导入文件包含 <b>${cams.length}</b> 个点位。</p>
        <p>继续将<b>替换</b>当前标注（导入后可用 Ctrl+Z 撤销）。建议先导出当前 JSON 备份。</p>`,
      ok: '替换并导入'
    });
    if (!ok) return;
  }
  mutate(() => {
    state.cams = cams;
    state.page = null;
    state.armed = false;
  });
  saveNow();
  renderAll();
  toast(`已导入 ${cams.length} 个点位`, 2600);
}

function normalizeImport(obj) {
  const list = [];
  if (Array.isArray(obj.floors)) {
    for (const fl of obj.floors) {
      const fid = fl.id === 'landscape' ? DEFAULT_FLOOR : fl.id;
      const f = FLOOR_BY_ID.get(fid);
      const arr = fl.cameras || fl.cams || [];
      for (const c of arr) list.push(Object.assign({}, c, { floor: fid, __f: f }));
    }
  }
  if (Array.isArray(obj.cams)) {
    for (const c of obj.cams) list.push(c);
  }
  const mapped = list.map(c => {
    const fid = c.floor === 'landscape' ? DEFAULT_FLOOR : (FLOOR_BY_ID.has(c.floor) ? c.floor : null);
    const f = c.__f || (fid ? FLOOR_BY_ID.get(fid) : null);
    let pages = Array.isArray(c.pages) ? c.pages.map(Number) : null;
    if (!pages) pages = c.primary != null ? [Number(c.primary)] : (c.no != null ? [Number(c.no)] : []);
    let x = c.x, y = c.y;
    if ((x == null || y == null) && c.nx != null && c.ny != null && f) { x = c.nx * f.w; y = c.ny * f.h; }
    let dir = c.dir != null ? c.dir : c.bearing;
    if (dir == null && c.lx != null && c.ly != null && x != null) dir = dirFromVec(c.lx - x, c.ly - y);
    return Object.assign({}, c, { pages, x, y, dir: dir || 0, floor: c.floor });
  }).filter(c => c.pages.length && isFinite(c.x) && isFinite(c.y));
  return sanitizeCams(mapped);
}

function connectFolder(fileList) {
  const map = new Map();
  for (const f of fileList) {
    if (/\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name)) map.set(f.name, f);
  }
  if (!map.size) { toast('这个文件夹里没有图片文件'); return; }
  for (const u of state.blobUrls.values()) { try { URL.revokeObjectURL(u); } catch (e) { /* ignore */ } }
  state.blobUrls.clear();
  state.blobMap = map;
  state.planCache = {};
  planImg.removeAttribute('src');
  planFail.hidden = true;
  loadPlan(state.floor, ok => {
    if (ok) {
      if (state.views[state.floor]) { state.view = { ...state.views[state.floor] }; }
      fitView();
      renderAll();
      toast(`素材已连接：${map.size} 个图片文件`, 2400);
    }
  });
}

/* =========================================================
   18. 绑定 / 初始化
   ========================================================= */
function bindUI() {
  stage.addEventListener('pointerdown', onPointerDown);
  stage.addEventListener('pointermove', onPointerMove);
  stage.addEventListener('pointerup', onPointerUp);
  stage.addEventListener('pointercancel', onPointerUp);
  stage.addEventListener('pointerleave', () => { if (!state.drag) hideTip(); });
  stage.addEventListener('wheel', onWheel, { passive: false });
  stage.addEventListener('contextmenu', e => e.preventDefault());
  // 平面图上禁止原生“选中文字/拖拽元素”：拖动点位时被浏览器抢走手势就是这么来的
  stage.addEventListener('dragstart', e => e.preventDefault());
  stage.addEventListener('selectstart', e => e.preventDefault());
  stage.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });

  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);
  window.addEventListener('resize', () => {
    if (!state.planW) return;
    if (!state.viewTouched) fitView();
    else { clampView(); applyView(); }
  });
  new ResizeObserver(() => {
    if (!state.planW) return;
    if (!state.viewTouched) fitView();
    else { clampView(); applyView(); }
  }).observe(stage);

  $('#btnUndo').onclick = undo;
  $('#btnRedo').onclick = redo;
  $('#btnFit').onclick = () => { fitView(); toast('已适配图纸', 1000); };
  $('#btnZoomIn').onclick = () => zoomCenter(1.25);
  $('#btnZoomOut').onclick = () => zoomCenter(1 / 1.25);
  $('#btnZoomFit').onclick = () => fitView();
  $('#btnHelp').onclick = openHelp;
  $('#btnLabels').onclick = toggleLabels;
  $('#btnWedges').onclick = toggleWedges;
  $('#btnImport').onclick = () => $('#fileJson').click();
  $('#btnClear').onclick = () => clearAllCams();
  $('#fileJson').onchange = e => {
    const f = e.target.files[0];
    if (f) importJSON(f);
    e.target.value = '';
  };
  $('#fileDir').onchange = e => {
    connectFolder(e.target.files);
    e.target.value = '';
  };
  $('#btnRelinkFail').onclick = () => $('#fileDir').click();

  $('#exportMenu').addEventListener('click', e => {
    const b = e.target.closest('[data-export]');
    if (!b) return;
    $('#exportMenu').classList.remove('show');
    const k = b.dataset.export;
    if (k === 'json') exportJSON();
    else if (k === 'md') exportMarkdown();
    else if (k === 'csv') exportCSV();
    else if (k === 'png') exportPNG();
    else if (k === 'print') printPlan(false);
    else if (k === 'printAll') printPlan(true);
    else if (k === 'clip') exportSummary();
  });
  $('#btnExport').onclick = e => {
    e.stopPropagation();
    $('#exportMenu').classList.toggle('show');
  };
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-wrap')) $('#exportMenu').classList.remove('show');
  });

  floorTabs.addEventListener('click', e => {
    const b = e.target.closest('[data-floor]');
    if (!b) return;
    setFloor(b.dataset.floor);
    scrollToFloor(b.dataset.floor);
    state.prefs.floor = b.dataset.floor;
    saveSoon();
  });
  filtersEl.addEventListener('click', e => {
    const b = e.target.closest('[data-filter]');
    if (!b) return;
    state.filter = b.dataset.filter;
    renderList();
  });
  $('#sortSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-sort]');
    if (!b) return;
    state.sort = b.dataset.sort;
    document.querySelectorAll('#sortSeg button').forEach(x => x.classList.toggle('on', x === b));
    renderList();
  });
  searchEl.addEventListener('input', () => {
    state.q = searchEl.value;
    renderList();
  });
  listEl.addEventListener('click', e => {
    const row = e.target.closest('[data-page]');
    if (!row) return;
    openPage(+row.dataset.page);
    if (window.matchMedia('(max-width:980px)').matches) $('#leftPanel').classList.remove('show');
  });

  // 灯箱
  $('#lbClose').onclick = closeLightbox;
  $('#lbPrev').onclick = () => { if (lb.page != null) { goPage(-1); openLightbox(state.page); } };
  $('#lbNext').onclick = () => { if (lb.page != null) { goPage(1); openLightbox(state.page); } };
  $('#lightbox').addEventListener('click', e => { if (e.target === $('#lightbox')) closeLightbox(); });
  $('#modal').addEventListener('click', e => { if (e.target === $('#modal')) closeModal(); });
  const lbWrap = $('#lbWrap');
  lbWrap.addEventListener('wheel', e => { e.preventDefault(); lbZoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
  lbWrap.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    lb.drag = { x: e.clientX, y: e.clientY, tx: lb.tx, ty: lb.ty, moved: 0, onImg: e.target === $('#lbImg') };
    lbWrap.classList.add('drag');
    try { lbWrap.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  lbWrap.addEventListener('pointermove', e => {
    if (!lb.drag) return;
    lb.drag.moved = Math.max(lb.drag.moved, Math.abs(e.clientX - lb.drag.x) + Math.abs(e.clientY - lb.drag.y));
    lb.tx = lb.drag.tx + (e.clientX - lb.drag.x);
    lb.ty = lb.drag.ty + (e.clientY - lb.drag.y);
    $('#lbImg').style.transform = `translate(${lb.tx}px,${lb.ty}px) scale(${lb.scale})`;
  });
  const endLb = () => {
    if (lb.drag) lb.lastGesture = lb.drag;
    lb.drag = null;
    lbWrap.classList.remove('drag');
  };
  lbWrap.addEventListener('pointerup', endLb);
  lbWrap.addEventListener('pointercancel', endLb);
  // 点击图片以外的空白处关闭（拖拽过则不触发）
  lbWrap.addEventListener('click', e => {
    const g = lb.lastGesture;
    if (!g || g.onImg || g.moved > 8) return;
    if (e.target !== lbWrap) return;
    closeLightbox();
  });
  lbWrap.addEventListener('dblclick', lbReset);

  // 拖放 JSON
  let dragDepth = 0;
  window.addEventListener('dragenter', e => {
    if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
    dragDepth++;
    $('#dropzone').classList.add('show');
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#dropzone').classList.remove('show'); });
  window.addEventListener('drop', e => {
    e.preventDefault();
    dragDepth = 0;
    $('#dropzone').classList.remove('show');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && /\.json$/i.test(f.name)) importJSON(f);
    else if (f) toast('只支持导入 JSON 标注文件');
  });

  // 移动端抽屉
  const btnInspect = $('#btnInspect'), rightPanel = $('#rightPanel');
  if (btnInspect) btnInspect.onclick = () => rightPanel.classList.toggle('show');
  const btnPages = $('#btnPages'), leftPanel = $('#leftPanel');
  if (btnPages) btnPages.onclick = () => leftPanel.classList.toggle('show');
  const btnCloseInspect = $('#btnCloseInspect');
  if (btnCloseInspect) btnCloseInspect.onclick = () => rightPanel.classList.remove('show');

  window.addEventListener('beforeunload', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
  window.addEventListener('blur', () => { state.space = false; stage.classList.remove('space'); });

  // 空格平移
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !isTyping()) {
      state.space = true;
      stage.classList.add('space');
      e.preventDefault();
    }
  });
}

function applyPrefs() {
  $('#btnLabels').classList.toggle('on', state.prefs.labels);
  $('#btnWedges').classList.toggle('on', state.prefs.wedges);
  document.querySelectorAll('#sortSeg button').forEach(b => b.classList.toggle('on', b.dataset.sort === state.sort));
  applyRightW();
}

function init() {
  $('#totalCount').textContent = TOTAL;
  loadSaved();
  bindUI();
  state.floor = FLOOR_BY_ID.has(state.prefs.floor) ? state.prefs.floor : DEFAULT_FLOOR;
  applyPrefs();
  renderCounts();
  renderFloorTabs();
  setFloor(state.floor, { fit: true });
  renderAll();
  updateHistoryButtons();

  // 接着上次的位置继续（页码合法才恢复）
  const last = state.prefs.page;
  if (last != null && PAGE_BY_NO.has(last)) openPage(last, { silent: true });
}

// 供调试 / 自动化测试使用（不参与界面）
window.__tool = {
  get state() { return state; },
  openPage, setFloor, fitView, exportJSON, exportMarkdown, exportCSV, renderAll,
  buildPrintSheet, printPlan, importJSON,
  get cams() { return state.cams; },
  place(no, x, y, dir) {
    const p = PAGE_BY_NO.get(no);
    if (!p) return null;
    setFloor(sectionFloor(p));
    state.page = no; state.armed = true;
    const cam = { id: 'c' + no, pages: [no], floor: state.floor, x, y, dir, fov: 65, name: '', note: '', locked: false };
    mutate(() => { state.cams.push(cam); state.armed = false; });
    renderAll();
    return cam;
  }
};

/* =========================================================
   右栏宽度可拖拽（2026-10-30 加）
   拖动右栏左边缘调宽；宽度记进 prefs.rightW，跟 localStorage 一起持久化。
   ========================================================= */
const R_MIN_W = 320;
const R_MAX_W = 760;
function rightPanelEl() { return document.getElementById('rightPanel'); }
function wsEl() { return document.querySelector('.workspace'); }
function clampRightW(w) {
  const room = window.innerWidth - 300 - 320;      // 左侧面板 + 平面图最小可视宽度
  return Math.round(clamp(w, R_MIN_W, Math.max(R_MIN_W, Math.min(R_MAX_W, room))));
}
function applyRightW() {
  // 注意：--right-w 要设在 .workspace 上（网格列宽与浮层宽度都从那里读），设在右栏自己身上不生效
  const ws = wsEl();
  if (!ws) return;
  if (state.prefs.rightW) ws.style.setProperty('--right-w', clampRightW(state.prefs.rightW) + 'px');
  else ws.style.removeProperty('--right-w');       // 没记过就回到 CSS 默认值
}
function bindRightResize() {
  const hand = document.getElementById('rHand'), panel = rightPanelEl();
  if (!hand || !panel) return;
  let drag = null;
  hand.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    drag = { x: e.clientX, w: panel.getBoundingClientRect().width };
    hand.classList.add('on');
    document.body.classList.add('rresize');
    try { hand.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    e.preventDefault();
  });
  hand.addEventListener('pointermove', e => {
    if (!drag) return;
    wsEl().style.setProperty('--right-w', clampRightW(drag.w - (e.clientX - drag.x)) + 'px');
  });
  const end = () => {
    if (!drag) return;
    drag = null;
    hand.classList.remove('on');
    document.body.classList.remove('rresize');
    state.prefs.rightW = Math.round(panel.getBoundingClientRect().width);
    saveSoon();
  };
  hand.addEventListener('pointerup', end);
  hand.addEventListener('pointercancel', end);
  hand.addEventListener('dblclick', () => { delete state.prefs.rightW; applyRightW(); saveSoon(); });
  window.addEventListener('resize', () => { if (state.prefs.rightW) applyRightW(); });
}
bindRightResize();

init();
})();
